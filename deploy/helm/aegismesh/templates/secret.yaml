{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
{{- range $k, $v := dict "dbPassword" $s.dbPassword "ledgerSigningKey" $s.ledgerSigningKey "svidSigningKey" $s.svidSigningKey "authSecret" $s.authSecret }}
{{- if or (not $v) (eq $v "CHANGE_ME") }}{{ fail (printf "secrets.%s 필요 (또는 secrets.existingSecret) — CHANGE_ME 금지" $k) }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegismesh.secretName" . }}
  labels: {{- include "aegismesh.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ $s.dbPassword | quote }}
  LEDGER_SIGNING_KEY: {{ $s.ledgerSigningKey | quote }}
  SVID_SIGNING_KEY: {{ $s.svidSigningKey | quote }}
  AUTH_SECRET: {{ $s.authSecret | quote }}
  {{- with $s.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
