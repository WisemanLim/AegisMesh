{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aegismesh.dbHost" . }}
  labels: {{- include "aegismesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "aegismesh.dbHost" . }}
  replicas: 1
  selector: { matchLabels: {{ include "aegismesh.sel" (list . "postgres") }} }
  template:
    metadata: { labels: {{ include "aegismesh.sel" (list . "postgres") }} }
    spec:
      securityContext: { fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          args: ["-c", "max_connections={{ .Values.postgresql.maxConnections }}"]
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.user | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "aegismesh.secretName" . }}, key: DB_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432, name: pg }]
          readinessProbe: { exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }, periodSeconds: 5 }
          volumeMounts: [{ name: pgdata, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: pgdata }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.postgresql.storage }} } } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegismesh.dbHost" . }}
  labels: {{- include "aegismesh.labels" . | nindent 4 }}
spec:
  selector: {{ include "aegismesh.sel" (list . "postgres") }}
  ports: [{ port: 5432, targetPort: pg, name: pg }]
{{- end }}
