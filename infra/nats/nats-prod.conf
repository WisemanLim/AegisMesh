# 발견 버스 NATS (Epic 60, prod 리허설) — JetStream 파일 저장 + 상호 TLS(내부 CA, 클라이언트 인증서 필수). 모니터링은 컨테이너 안에서만.
server_name: aegis-nats
listen: 0.0.0.0:4222
http: 127.0.0.1:8222
jetstream {
  store_dir: /data
}
tls {
  cert_file: /tls/tls.crt
  key_file: /tls/tls.key
  ca_file: /tls/ca.crt
  verify: true
  timeout: 3
}
