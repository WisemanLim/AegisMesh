# aegismesh prod PostgreSQL 접근 규칙 — 주 서버·대기 서버·복구 훈련 서버가 같은 파일을 쓴다(-c hba_file).
# 컨테이너 밖에서 오는 연결은 TLS 만 받는다(NFR-D3 상호 TLS): 내부 CA 가 서명한 클라이언트 인증서 + SCRAM 비밀번호.
# 복제(replicator)는 인증서 CN 이 역할 이름과 같아야 한다(verify-full). 평문(hostnossl) 줄이 없으므로 평문 원격 접속은 거부된다.
local   all          all                       trust
host    all          all          127.0.0.1/32 trust
host    all          all          ::1/128      trust
local   replication  all                       trust
hostssl replication  replicator   all          scram-sha-256  clientcert=verify-full
hostssl all          all          all          scram-sha-256  clientcert=verify-ca
