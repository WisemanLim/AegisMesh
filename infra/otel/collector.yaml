# 자동 생성 — 수정하지 말 것. 원천: observability/masking.yaml → python scripts/gen_otel_config.py
# 파이프라인: 수신(OTLP) → 처리(메모리 한도·민감정보 마스킹·배치) → 내보내기(debug; 운영 백엔드는 exporters 에 추가)
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  transform/mask:
    error_mode: ignore
    trace_statements:
    - context: span
      statements:
      - replace_all_patterns(span.attributes, "value", "\\d{6}-[1-4]\\d{6}", "[REDACTED_RRN]")
      - replace_pattern(span.name, "\\d{6}-[1-4]\\d{6}", "[REDACTED_RRN]")
      - replace_all_patterns(span.attributes, "value", "\\b(?:\\d{4}[- ]?){3}\\d{4}\\b", "[REDACTED_CARD]")
      - replace_pattern(span.name, "\\b(?:\\d{4}[- ]?){3}\\d{4}\\b", "[REDACTED_CARD]")
      - replace_all_patterns(span.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
      - replace_pattern(span.name, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
      - replace_all_patterns(span.attributes, "value", "01[016789]-?\\d{3,4}-?\\d{4}", "[REDACTED_PHONE]")
      - replace_pattern(span.name, "01[016789]-?\\d{3,4}-?\\d{4}", "[REDACTED_PHONE]")
      - replace_all_patterns(span.attributes, "value", "(?:sk-(?:ant-)?[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})", "[REDACTED_KEY]")
      - replace_pattern(span.name, "(?:sk-(?:ant-)?[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})", "[REDACTED_KEY]")
      - replace_all_patterns(span.attributes, "value", "(?:[Bb]earer\\s+[A-Za-z0-9._~+/=-]{16,}|am1\\.[0-9a-f]{32}\\.[A-Za-z0-9_-]{20,})", "[REDACTED_TOKEN]")
      - replace_pattern(span.name, "(?:[Bb]earer\\s+[A-Za-z0-9._~+/=-]{16,}|am1\\.[0-9a-f]{32}\\.[A-Za-z0-9_-]{20,})", "[REDACTED_TOKEN]")
    - context: spanevent
      statements:
      - replace_all_patterns(spanevent.attributes, "value", "\\d{6}-[1-4]\\d{6}", "[REDACTED_RRN]")
      - replace_all_patterns(spanevent.attributes, "value", "\\b(?:\\d{4}[- ]?){3}\\d{4}\\b", "[REDACTED_CARD]")
      - replace_all_patterns(spanevent.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
      - replace_all_patterns(spanevent.attributes, "value", "01[016789]-?\\d{3,4}-?\\d{4}", "[REDACTED_PHONE]")
      - replace_all_patterns(spanevent.attributes, "value", "(?:sk-(?:ant-)?[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})", "[REDACTED_KEY]")
      - replace_all_patterns(spanevent.attributes, "value", "(?:[Bb]earer\\s+[A-Za-z0-9._~+/=-]{16,}|am1\\.[0-9a-f]{32}\\.[A-Za-z0-9_-]{20,})", "[REDACTED_TOKEN]")
    log_statements:
    - context: log
      statements:
      - replace_all_patterns(log.attributes, "value", "\\d{6}-[1-4]\\d{6}", "[REDACTED_RRN]")
      - replace_pattern(log.body, "\\d{6}-[1-4]\\d{6}", "[REDACTED_RRN]")
      - replace_all_patterns(log.attributes, "value", "\\b(?:\\d{4}[- ]?){3}\\d{4}\\b", "[REDACTED_CARD]")
      - replace_pattern(log.body, "\\b(?:\\d{4}[- ]?){3}\\d{4}\\b", "[REDACTED_CARD]")
      - replace_all_patterns(log.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
      - replace_pattern(log.body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
      - replace_all_patterns(log.attributes, "value", "01[016789]-?\\d{3,4}-?\\d{4}", "[REDACTED_PHONE]")
      - replace_pattern(log.body, "01[016789]-?\\d{3,4}-?\\d{4}", "[REDACTED_PHONE]")
      - replace_all_patterns(log.attributes, "value", "(?:sk-(?:ant-)?[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})", "[REDACTED_KEY]")
      - replace_pattern(log.body, "(?:sk-(?:ant-)?[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})", "[REDACTED_KEY]")
      - replace_all_patterns(log.attributes, "value", "(?:[Bb]earer\\s+[A-Za-z0-9._~+/=-]{16,}|am1\\.[0-9a-f]{32}\\.[A-Za-z0-9_-]{20,})", "[REDACTED_TOKEN]")
      - replace_pattern(log.body, "(?:[Bb]earer\\s+[A-Za-z0-9._~+/=-]{16,}|am1\\.[0-9a-f]{32}\\.[A-Za-z0-9_-]{20,})", "[REDACTED_TOKEN]")
    metric_statements:
    - context: datapoint
      statements:
      - replace_all_patterns(datapoint.attributes, "value", "\\d{6}-[1-4]\\d{6}", "[REDACTED_RRN]")
      - replace_all_patterns(datapoint.attributes, "value", "\\b(?:\\d{4}[- ]?){3}\\d{4}\\b", "[REDACTED_CARD]")
      - replace_all_patterns(datapoint.attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
      - replace_all_patterns(datapoint.attributes, "value", "01[016789]-?\\d{3,4}-?\\d{4}", "[REDACTED_PHONE]")
      - replace_all_patterns(datapoint.attributes, "value", "(?:sk-(?:ant-)?[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36})", "[REDACTED_KEY]")
      - replace_all_patterns(datapoint.attributes, "value", "(?:[Bb]earer\\s+[A-Za-z0-9._~+/=-]{16,}|am1\\.[0-9a-f]{32}\\.[A-Za-z0-9_-]{20,})", "[REDACTED_TOKEN]")
  batch:
    timeout: 2s
exporters:
  debug:
    verbosity: ${env:OTEL_DEBUG_VERBOSITY:-basic}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions:
  - health_check
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/mask
      - batch
      exporters:
      - debug
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/mask
      - batch
      exporters:
      - debug
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/mask
      - batch
      exporters:
      - debug
