# SPIRE agent (Epic 53) — api 컨테이너와 PID 네임스페이스를 함께 써서(compose pid: service:api) 프로세스 uid 로 워크로드를 증명한다.
# 서버 신뢰 번들은 make spire-up 이 받아 둔 파일(첫 연결부터 검증, insecure_bootstrap 안 씀). Workload API 소켓은 볼륨 spiresock.
agent {
  data_dir = "/opt/spire/data/agent"
  log_level = "INFO"
  server_address = "spire-server"
  server_port = "8081"
  socket_path = "/run/spire/agent/api.sock"
  trust_domain = "aegismesh.local"
  trust_bundle_path = "/opt/spire/conf/aegis/bundle.pem"
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }
  KeyManager "disk" {
    plugin_data {
      directory = "/opt/spire/data/agent"
    }
  }
  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
