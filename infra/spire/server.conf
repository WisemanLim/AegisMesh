# SPIRE server (Epic 53 · 화면설계서 "워크로드 신원 — SPIRE") — 신뢰 도메인은 SPIFFE_TRUST_DOMAIN 과 같아야 한다.
# 노드 증명 = join token(make spire-up 이 별칭 spiffe://<td>/node/api 로 발급), 키는 디스크(볼륨 spiredata), 데이터 저장 = SQLite.
server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/run/spire/server/api.sock"
  trust_domain = "aegismesh.local"
  data_dir = "/opt/spire/data/server"
  log_level = "INFO"
  ca_key_type = "ec-p256"
  jwt_key_type = "ec-p256"
  jwt_issuer = "spiffe://aegismesh.local"
  ca_ttl = "168h"
  default_x509_svid_ttl = "1h"
  default_jwt_svid_ttl = "1h"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/opt/spire/data/server/datastore.sqlite3"
    }
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/opt/spire/data/server/keys.json"
    }
  }
  NodeAttestor "join_token" {
    plugin_data {}
  }
}
