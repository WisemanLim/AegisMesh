apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d1-05
  name: Hidden Payload Detector
  nameKo: 은닉 페이로드 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D1
    item: Hidden payloads
spec:
  series: C1
  gate: input
  isolation: L0
  verdicts:
  - block
  - transform
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM01
    owasp-asi:
      version: '2026'
      ids:
      - ASI01
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0011
      - AML.TA0005
    cwe:
      version: '4.20'
      ids:
      - CWE-94
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: unicode_rules
    available:
    - id: unicode_rules
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
