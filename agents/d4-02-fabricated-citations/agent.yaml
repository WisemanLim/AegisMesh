apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d4-02
  name: Citation Verifier
  nameKo: 인용 날조 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D4
    item: Fabricated citations
spec:
  series: C1
  gate: output
  isolation: L0
  verdicts:
  - transform
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM07
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0012
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: citation_check
    available:
    - id: citation_check
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    knownCitations:
      type: list
      items: string
      default: []
      labelKo: 확인된 인용 출처
      labelEn: Known citations
    allowUnlistedUrls:
      type: boolean
      default: false
      labelKo: 목록 밖 URL 허용
      labelEn: Allow unlisted URLs
