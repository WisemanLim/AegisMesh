apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d7-06
  name: Model Artifact Scanner
  nameKo: 모델 오염 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D7
    item: Model poisoning
spec:
  series: C3
  gate: offline
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM04
      - LLM05
    owasp-asi:
      version: '2026'
      ids:
      - ASI04
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0002
      - AML.TA0003
    cwe:
      version: '4.20'
      ids:
      - CWE-502
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: model_artifact
    available:
    - id: model_artifact
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    allowPickle:
      type: boolean
      default: false
      labelKo: pickle 형식 허용
      labelEn: Allow pickle formats
