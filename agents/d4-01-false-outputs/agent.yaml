apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d4-01
  name: Groundedness Checker
  nameKo: 허위 출력 탐지기
  version: 1.1.0
  source:
    diagram: Security Risks in AI Agents
    domain: D4
    item: False outputs
spec:
  series: C1
  gate: output
  isolation: L0
  verdicts:
  - transform
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM07
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0012
    cwe:
      version: '4.20'
      ids:
      - CWE-1039
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: groundedness
    available:
    - id: groundedness
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
