apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d8-07
  name: Retrieval Bias Monitor
  nameKo: 검색 편향 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D8
    item: Retrieval bias
spec:
  series: C1
  gate: input
  isolation: L0
  verdicts:
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM08
      - LLM09
    owasp-asi:
      version: '2026'
      ids:
      - ASI06
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0006
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: source_diversity
    available:
    - id: source_diversity
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    minDocs:
      type: integer
      default: 5
      min: 1
      labelKo: 최소 검색 문서 수
      labelEn: Min retrieved docs
    maxSourceShare:
      type: number
      default: 0.6
      min: 0
      max: 1
      labelKo: 단일 출처 최대 비중
      labelEn: Max single-source share
