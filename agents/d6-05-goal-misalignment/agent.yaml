apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d6-05
  name: Goal Alignment Guard
  nameKo: 목표 불일치 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D6
    item: Goal misalignment
spec:
  series: C2
  gate: tool
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 10
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM03
      - LLM06
    owasp-asi:
      version: '2026'
      ids:
      - ASI01
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0012
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: forbidden_means
    available:
    - id: forbidden_means
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    forbiddenMeans:
      type: list
      items: string
      default: []
      labelKo: 금지 수단
      labelEn: Forbidden means
