apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d3-07
  name: Unauthorized Execution Guard
  nameKo: 무단 실행 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D3
    item: Unauthorized execution
spec:
  series: C2
  gate: tool
  isolation: L0
  verdicts:
  - block
  - require_approval
  - allow
  latencyBudgetMs: 10
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM03
    owasp-asi:
      version: '2026'
      ids:
      - ASI02
      - ASI05
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0011
      - AML.TA0012
    cwe:
      version: '4.20'
      ids:
      - CWE-94
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: exec_allowlist
    available:
    - id: exec_allowlist
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    toolAllowlist:
      type: list
      items: string
      labelKo: 도구 허용목록(미설정 = 제한 없음)
      labelEn: Tool allowlist (unset = no limit)
