apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d5-03
  name: Session Hijacking Detector
  nameKo: 세션 탈취 탐지기
  version: 1.2.0
  source:
    diagram: Security Risks in AI Agents
    domain: D5
    item: Session hijacking
spec:
  series: C2
  gate: input
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 10
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM02
      - LLM03
    owasp-asi:
      version: '2026'
      ids:
      - ASI03
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0004
    cwe:
      version: '4.20'
      ids:
      - CWE-384
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: session_binding
    available:
    - id: session_binding
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
