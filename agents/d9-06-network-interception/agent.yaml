apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d9-06
  name: Network Policy Checker
  nameKo: 네트워크 가로채기 탐지기
  version: 1.1.0
  source:
    diagram: Security Risks in AI Agents
    domain: D9
    item: Network interception
spec:
  series: C3
  gate: offline
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    cwe:
      version: '4.20'
      ids:
      - CWE-300
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: network_policy
    available:
    - id: network_policy
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
