apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: x09
  name: Red Team Regression Gate
  nameKo: 상시 레드팀 탐지기
  version: 1.0.0
  source:
    diagram: AegisMesh gap analysis
    domain: X
    item: Continuous red teaming
spec:
  series: C3
  gate: offline
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    nist-ai-rmf:
      version: '1.0'
      ids:
      - MEASURE 2.7
      - MANAGE 4.1
    iso-42001:
      version: '2023'
      ids:
      - '9.1'
      - '10.1'
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: redteam_regression
    available:
    - id: redteam_regression
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    maxAgeSec:
      type: integer
      default: 604800
      min: 60
      labelKo: 레드팀 결과 최대 경과(초)
      labelEn: Max red-team result age (s)
