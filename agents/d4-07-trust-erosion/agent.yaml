apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d4-07
  name: Trust Signal Monitor
  nameKo: 신뢰 침식 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D4
    item: Trust erosion
spec:
  series: C1
  gate: output
  isolation: L0
  verdicts:
  - transform
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM07
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0012
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: trust_signals
    available:
    - id: trust_signals
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    lowConfidence:
      type: number
      default: 0.5
      min: 0
      max: 1
      labelKo: 저신뢰 기준
      labelEn: Low-confidence level
    trustRegression:
      type: number
      default: 0.05
      min: 0
      max: 1
      labelKo: 신뢰 지표 회귀 허용폭
      labelEn: Trust regression tolerance
