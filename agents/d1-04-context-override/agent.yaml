apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d1-04
  name: Context Override Detector
  nameKo: 컨텍스트 덮어쓰기 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D1
    item: Context override
spec:
  series: C1
  gate: input
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM01
    owasp-asi:
      version: '2026'
      ids:
      - ASI01
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0011
      - AML.TA0005
    cwe:
      version: '4.20'
      ids:
      - CWE-77
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: position_override
    available:
    - id: position_override
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    longContextChars:
      type: integer
      default: 4000
      min: 100
      labelKo: 긴 컨텍스트 기준(문자)
      labelEn: Long-context threshold (chars)
    lateFraction:
      type: number
      default: 0.7
      min: 0
      max: 1
      labelKo: 후반부 지시 위치 비율
      labelEn: Late-instruction position fraction
