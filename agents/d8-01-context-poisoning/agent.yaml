apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d8-01
  name: Context Poisoning Detector
  nameKo: 컨텍스트 오염 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D8
    item: Context poisoning
spec:
  series: C1
  gate: input
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM08
      - LLM09
    owasp-asi:
      version: '2026'
      ids:
      - ASI06
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0006
    cwe:
      version: '4.20'
      ids:
      - CWE-77
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: context_scan
    available:
    - id: context_scan
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    trustedSources:
      type: list
      items: string
      default: []
      labelKo: 신뢰 출처
      labelEn: Trusted sources
    requireSignedDocs:
      type: boolean
      default: false
      labelKo: 서명 문서만 허용
      labelEn: Require signed documents
