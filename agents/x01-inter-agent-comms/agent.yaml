apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: x01
  name: Inter-Agent Trust Verifier
  nameKo: 에이전트 간 통신 보안 탐지기
  version: 1.0.1
  source:
    diagram: AegisMesh gap analysis
    domain: X
    item: Inter-agent communication security
spec:
  series: C2
  gate: tool
  isolation: L0
  verdicts:
  - block
  - allow
  latencyBudgetMs: 10
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM03
    owasp-asi:
      version: '2026'
      ids:
      - ASI07
    cwe:
      version: '4.20'
      ids:
      - CWE-345
      - CWE-295
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: card_signature
    available:
    - id: card_signature
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    trustedKeys:
      type: map
      default: {}
      labelKo: '신뢰 키 {keyId: base64 공개키}'
      labelEn: 'Trusted keys {keyId: base64 public key}'
