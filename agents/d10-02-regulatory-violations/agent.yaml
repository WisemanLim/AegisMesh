apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d10-02
  name: Regulatory Control Mapper
  nameKo: 규제 위반 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D10
    item: Regulatory violations
spec:
  series: C4
  gate: offline
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    nist-ai-rmf:
      version: '1.0'
      ids:
      - GOVERN 1.1
      - MAP 4.1
    iso-42001:
      version: '2023'
      ids:
      - '4.1'
      - '9.2'
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: control_mapping
    available:
    - id: control_mapping
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
