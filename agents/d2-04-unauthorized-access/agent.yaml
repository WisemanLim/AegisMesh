apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d2-04
  name: Retrieval Authorization Checker
  nameKo: 무단 접근 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D2
    item: Unauthorized access
spec:
  series: C3
  gate: input
  isolation: L0
  verdicts:
  - block
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM02
    owasp-asi:
      version: '2026'
      ids:
      - ASI06
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0010
    cwe:
      version: '4.20'
      ids:
      - CWE-285
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: retrieval_acl
    available:
    - id: retrieval_acl
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
