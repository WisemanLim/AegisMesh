apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d3-04
  name: File Manipulation Guard
  nameKo: 파일 조작 탐지기
  version: 1.1.0
  source:
    diagram: Security Risks in AI Agents
    domain: D3
    item: File manipulation
spec:
  series: C2
  gate: tool
  isolation: L0
  verdicts:
  - block
  - require_approval
  - allow
  latencyBudgetMs: 10
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM03
    owasp-asi:
      version: '2026'
      ids:
      - ASI02
      - ASI05
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0011
      - AML.TA0012
    cwe:
      version: '4.20'
      ids:
      - CWE-22
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: path_rules
    available:
    - id: path_rules
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    allowedPaths:
      type: list
      items: string
      default:
      - /workspace
      labelKo: 허용 파일 경로
      labelEn: Allowed file paths
    readOnlyPaths:
      type: list
      items: string
      default: []
      labelKo: 읽기 전용 마운트 경로
      labelEn: Read-only mount paths
