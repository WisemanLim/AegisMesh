apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d7-05
  name: Dataset Integrity Checker
  nameKo: 데이터셋 변조 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D7
    item: Dataset tampering
spec:
  series: C3
  gate: offline
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM04
      - LLM05
    owasp-asi:
      version: '2026'
      ids:
      - ASI04
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0002
      - AML.TA0003
    cwe:
      version: '4.20'
      ids:
      - CWE-345
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: dataset_integrity
    available:
    - id: dataset_integrity
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    maxLabelShift:
      type: number
      default: 0.2
      min: 0
      max: 1
      labelKo: 라벨 분포 변화 한도
      labelEn: Max label shift
    maxGrowth:
      type: number
      default: 0.5
      min: 0
      labelKo: 데이터 증가율 한도
      labelEn: Max growth
