apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d5-06
  name: Token Misuse Detector
  nameKo: 토큰 오용 탐지기
  version: 1.1.0
  source:
    diagram: Security Risks in AI Agents
    domain: D5
    item: Token misuse
spec:
  series: C2
  gate: input
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 10
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM02
      - LLM03
    owasp-asi:
      version: '2026'
      ids:
      - ASI03
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0004
    cwe:
      version: '4.20'
      ids:
      - CWE-613
      - CWE-863
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: token_claims
    available:
    - id: token_claims
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    audience:
      type: string
      labelKo: 토큰 audience
      labelEn: Token audience
    clientId:
      type: string
      labelKo: 토큰 client_id
      labelEn: Token client_id
    maxLifetimeSec:
      type: integer
      default: 86400
      min: 60
      labelKo: 토큰 최대 수명(초)
      labelEn: Max token lifetime (s)
    requireAudience:
      type: boolean
      default: false
      labelKo: 수신자(aud) 제한 필수
      labelEn: Require audience (aud)
