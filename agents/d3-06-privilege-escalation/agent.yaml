apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d3-06
  name: Privilege Escalation Guard
  nameKo: 권한 상승 탐지기
  version: 1.1.0
  source:
    diagram: Security Risks in AI Agents
    domain: D3
    item: Privilege escalation
spec:
  series: C2
  gate: tool
  isolation: L0
  verdicts:
  - block
  - require_approval
  - allow
  latencyBudgetMs: 10
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM03
    owasp-asi:
      version: '2026'
      ids:
      - ASI02
      - ASI05
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0011
      - AML.TA0012
    cwe:
      version: '4.20'
      ids:
      - CWE-269
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: scope_check
    available:
    - id: scope_check
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    blockedChains:
      type: list
      items: string
      default: []
      labelKo: 차단할 도구 연쇄 (예 files.read->secrets.list)
      labelEn: Blocked tool chains (e.g. files.read->secrets.list)
