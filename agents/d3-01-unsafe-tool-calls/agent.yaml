apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d3-01
  name: Unsafe Tool Call Guard
  nameKo: 위험 도구 호출 탐지기
  version: 1.1.0
  source:
    diagram: Security Risks in AI Agents
    domain: D3
    item: Unsafe tool calls
spec:
  series: C2
  gate: tool
  isolation: L0
  verdicts:
  - block
  - require_approval
  - allow
  latencyBudgetMs: 10
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM03
    owasp-asi:
      version: '2026'
      ids:
      - ASI02
      - ASI05
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0011
      - AML.TA0012
    cwe:
      version: '4.20'
      ids:
      - CWE-749
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: risk_catalog
    available:
    - id: risk_catalog
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    highRiskTools:
      type: list
      items: string
      default: []
      labelKo: 고위험 도구(승인 필요)
      labelEn: High-risk tools (approval)
    maxRowsWithoutApproval:
      type: integer
      default: 1000
      min: 1
      labelKo: 드라이런 영향 행 임계(초과 → 사람 승인)
      labelEn: Dry-run row threshold (above → human approval)
