apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d1-06
  name: Injection Exfiltration Detector
  nameKo: 인젝션 경유 유출 탐지기
  version: 1.1.0
  source:
    diagram: Security Risks in AI Agents
    domain: D1
    item: Data exfiltration
spec:
  series: C1
  gate: output
  isolation: L0
  verdicts:
  - block
  - transform
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM01
      - LLM02
    owasp-asi:
      version: '2026'
      ids:
      - ASI01
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0011
      - AML.TA0005
    cwe:
      version: '4.20'
      ids:
      - CWE-200
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: egress_rules
    available:
    - id: egress_rules
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    urlAllowlist:
      type: list
      items: string
      default: []
      labelKo: URL 허용 호스트(하위 도메인 포함)
      labelEn: Allowed URL hosts (incl. subdomains)
    blockAutoRender:
      type: boolean
      default: true
      labelKo: 허용목록 밖 이미지 자동 렌더 차단(링크 텍스트로)
      labelEn: Block auto-render of non-allowlisted images (to link text)
    entropyBits:
      type: number
      default: 3.5
      min: 2
      max: 6
      labelKo: 엔트로피 임계(bits/char)
      labelEn: Entropy threshold (bits/char)
