apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d6-04
  name: Task Scope Guard
  nameKo: 과업 확대 탐지기
  version: 1.1.0
  source:
    diagram: Security Risks in AI Agents
    domain: D6
    item: Task escalation
spec:
  series: C2
  gate: tool
  isolation: L0
  verdicts:
  - block
  - require_approval
  - allow
  latencyBudgetMs: 10
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM03
      - LLM06
    owasp-asi:
      version: '2026'
      ids:
      - ASI01
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0012
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: scope_contract
    available:
    - id: scope_contract
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    contract:
      type: map
      labelKo: 과업 범위 계약 {goal, tools, actions, resources, maxSubtasks}
      labelEn: Task-scope contract {goal, tools, actions, resources, maxSubtasks}
