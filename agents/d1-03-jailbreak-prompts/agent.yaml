apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d1-03
  name: Jailbreak Prompt Detector
  nameKo: 탈옥 프롬프트 탐지기
  version: 1.3.0
  source:
    diagram: Security Risks in AI Agents
    domain: D1
    item: Jailbreak prompts
spec:
  series: C1
  gate: input
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM01
    owasp-asi:
      version: '2026'
      ids:
      - ASI01
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0011
      - AML.TA0005
    cwe:
      version: '4.20'
      ids:
      - CWE-693
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: jailbreak_classifier
    available:
    - id: jailbreak_classifier
      kind: builtin
    - id: jailbreak_corpus
      kind: builtin
    - id: jailbreak_guard
      kind: builtin
    - id: injection_model
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
