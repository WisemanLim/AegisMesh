apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d7-03
  name: Package Backdoor Detector
  nameKo: 라이브러리 백도어 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D7
    item: Library backdoors
spec:
  series: C3
  gate: offline
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM04
      - LLM05
    owasp-asi:
      version: '2026'
      ids:
      - ASI04
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0002
      - AML.TA0003
    cwe:
      version: '4.20'
      ids:
      - CWE-506
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: package_heuristics
    available:
    - id: package_heuristics
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    popularPackages:
      type: list
      items: string
      labelKo: 타이포스쿼팅 기준 인기 패키지(미설정 = 내장 목록)
      labelEn: Popular packages for typosquat check (unset = built-in)
