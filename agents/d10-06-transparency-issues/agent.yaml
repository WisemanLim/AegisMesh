apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d10-06
  name: System Card Checker
  nameKo: 투명성 결여 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D10
    item: Transparency issues
spec:
  series: C4
  gate: offline
  isolation: L0
  verdicts:
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    nist-ai-rmf:
      version: '1.0'
      ids:
      - GOVERN 4.2
      - MEASURE 2.9
    iso-42001:
      version: '2023'
      ids:
      - A.8
      - '7.5'
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: card_freshness
    available:
    - id: card_freshness
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
