apiVersion: aegismesh/v1
kind: Agent
metadata:
  id: d2-02
  name: Cross-Session Leak Detector
  nameKo: 세션 간 유출 탐지기
  version: 1.0.0
  source:
    diagram: Security Risks in AI Agents
    domain: D2
    item: Cross-session leaks
spec:
  series: C3
  gate: output
  isolation: L0
  verdicts:
  - block
  - alert
  - allow
  latencyBudgetMs: 30
  standards:
    owasp-llm:
      version: '2026'
      ids:
      - LLM02
    owasp-asi:
      version: '2026'
      ids:
      - ASI06
    mitre-atlas:
      version: '2026.06'
      ids:
      - AML.TA0010
    cwe:
      version: '4.20'
      ids:
      - CWE-668
  modes:
  - cli
  - rest
  - mcp
  engines:
    default: scope_mix
    available:
    - id: scope_mix
      kind: builtin
  io:
    input:
      schema: aegismesh.io/JudgeRequest/v1
    output:
      schema: aegismesh.io/Finding/v1
  resources:
    cpu: 100m
    memory: 128Mi
  dependencies: []
  tests:
    golden: tests/golden
    attacks: tests/attacks
    baseline: tests/baseline.json
    thresholds:
      falsePositiveRate: 0.005
      falseNegativeRate: 0.1
  config:
    sessionScopedMemory:
      type: boolean
      default: true
      labelKo: 메모리 세션 범위 강제
      labelEn: Enforce session-scoped memory
